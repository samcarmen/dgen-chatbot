[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dgen-chatbot"
version = "1.0.0"
description = "DGEN Chatbot"
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "flask>=3.1.0",
    "functions-framework>=3.9.2",
    "google-adk>=1.16.0",
    "google-cloud-aiplatform>=1.120.0",
    "google-cloud-firestore>=2.21.0",
    "google-cloud-logging>=3.12.0",
    "google-cloud-run>=0.6.0",
    "gunicorn>=22.0.0",
    "litellm>=1.80.0",
    "pydantic-settings>=2.9.1",
    "requests>=2.32.4",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "ruff>=0.11.10",
]
release = [
    "pulumi>=3.191.0",
    "pulumi-docker>=4.5.6",
    "pulumi-gcp>=8.38.0",
    "python-semantic-release~=10.4.0",
]
test = ["pytest>=8.4.1", "pytest-cov>=6.1.1", "pytest-env>=1.1.5"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["F", "E", "W", "I001"]
ignore = ["W605", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
default-groups = "all"

[tool.uv.workspace]
members = ["deployment/*"]
