[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infra"
version = "1.0.0"
description = "Provisions infrastructure, including Cloud Storage, IAM, and Firestore."
requires-python = "~=3.13.0"
dependencies = ["absl-py>=2.3.1", "google-adk>=1.17.0"]

[dependency-groups]
release = ["pulumi>=3.191.0", "pulumi-gcp>=8.38.0"]

[tool.uv]
package = false
default-groups = "all"
